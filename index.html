// ═══════════════ RELATIONSHIPS ═══════════════
const COMM_TIPS=[`Become genuinely curious about someone today. Ask a question you actually don't know the answer to — and then just listen.`,`Before you respond, take a breath. The pause is where real connection lives.`,`Say thank you for something specific. Not "thanks for everything" — but one real, particular thing.`,`Send a voice note instead of a text today. It's 10x more personal and people feel it.`,`Tell someone what you appreciate about them. Not what they did — who they are.`,`Ask "how are you really doing?" and mean it. Most people are waiting for someone to ask.`,`Listen to understand, not to respond. Notice when you're already formulating your reply before they finish.`,`Let someone feel like the most important person in the room when you're with them. Put the phone away.`,`Reach out to someone you've been meaning to contact. The thought doesn't count — the message does.`,`Notice when someone needs to be heard vs. when they need advice. Ask first: "Do you want me to just listen, or do you want my thoughts?"`,];
const REL_DAILY_Q=[`Who in your life needs a little extra love this week?`,`What relationship have you been neglecting that matters to you?`,`How have you been showing up in your most important relationships lately?`,`Who has shown up for you recently that you haven't thanked?`,`What would it look like to be a 10/10 friend, partner, or family member this week?`,];
const KIND_MESSAGES=[{type:`Just saying hi`,emoji:`👋`,text:`Hey, thinking of you. Hope your day is good.`},{type:`Checking in`,emoji:`💙`,text:`Hey — how are you doing? Would love to catch up soon.`},{type:`Miss you`,emoji:`🌸`,text:`Miss you. Let's actually make plans.`},{type:`Thinking of you`,emoji:`💜`,text:`You came to mind today. Hope everything's well.`},{type:`Want to see you`,emoji:`☕`,text:`We're overdue for a catch up. When are you free?`},{type:`Gratitude`,emoji:`🙏`,text:`Just wanted to say — I'm really glad you're in my life.`},{type:`Appreciation`,emoji:`✨`,text:`I don't say it enough, but I really appreciate you.`},{type:`Encouragement`,emoji:`🌱`,text:`Thinking of you and rooting for you. You've got this.`},{type:`Proud of you`,emoji:`🎉`,text:`I've been watching you grow and I just want to say — I'm proud of you.`},{type:`Simple love`,emoji:`❤️`,text:`No reason. Just love you and wanted to say it.`},{type:`Let's connect`,emoji:`📅`,text:`It's been too long. Can we get something on the calendar?`},{type:`Thank you`,emoji:`🤍`,text:`Thank you for always showing up. It means more than you know.`},{type:`Good morning`,emoji:`☀️`,text:`Good morning! Hope today is a great one for you.`},{type:`Just because`,emoji:`🫶`,text:`Sending you a little love today, just because.`},];
const REL_TYPES=['Friend','Family','Partner','Colleague'];
const REL_COLORS={Friend:{c:'#00c2d1',bg:'#e0fbfd',ink:'#00616a'},Family:{c:'#ff3ea5',bg:'#ffe6f3',ink:'#a3005c'},Partner:{c:'#ff3b3b',bg:'#ffe5e5',ink:'#a30000'},Colleague:{c:'#8b5cf6',bg:'#efe9ff',ink:'#5b21b6'}};
function relColor(t){return REL_COLORS[t]||REL_COLORS.Friend;}

function getTodaysMessages(){const day=dayOfYear();const total=KIND_MESSAGES.length;const indices=[];for(let i=0;i<6;i++){indices.push((day*6+i*Math.ceil(total/6))%total);}return [...new Set(indices)].slice(0,6).map(i=>({...KIND_MESSAGES[i],origIndex:i}));}

function renderRelationships(){
  if(!DB.relationships)DB.relationships={contacts:[],lastCheckins:{},connectionScores:{}};
  const r=DB.relationships;
  const contacts=r.contacts||[];
  const day=dayOfYear();
  const tip=COMM_TIPS[day%COMM_TIPS.length];
  const dailyQ=REL_DAILY_Q[day%REL_DAILY_Q.length];
  const todayScores=(r.dailyScores||{})[today()]||{};

  const connHtml=contacts.length?contacts.map((c,i)=>{
    const ini=c.name.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2);
    const score=todayScores[c.name]||0;
    const lastCheckin=(r.lastCheckins||{})[c.name];
    const freqDays={Daily:1,Weekly:7,Biweekly:14,Monthly:30}[c.frequency]||7;
    const daysSince=lastCheckin?Math.round((new Date(today()+'T12:00:00')-new Date(lastCheckin+'T12:00:00'))/(864e5)):999;
    const overdue=daysSince>=freqDays;
    const statusHtml=lastCheckin?(overdue?`<span class="contact-overdue">Overdue · ${daysSince}d ago</span>`:`<span class="contact-ok">✓ ${daysSince===0?'Today':(daysSince+'d ago')}</span>`):`<span class="contact-overdue">No check-in yet</span>`;
    return`<div class="contact-item"><div class="contact-avatar" style="background:${relColor(c.type).c}">${ini}</div><div class="contact-info" style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px"><div class="contact-name">${esc(c.name)}</div><div style="font-size:10px;font-weight:700;color:${relColor(c.type).ink};background:${relColor(c.type).bg};padding:2px 8px;border-radius:99px;border:1px solid ${relColor(c.type).c}">${c.type||'Friend'}</div></div><div style="display:flex;align-items:center;gap:3px;margin-top:6px;min-width:0">${Array.from({length:10},(_,j)=>j+1).map(n=>`<div onclick="setDailyScore('${esc(c.name)}',${n})" style="flex:1 1 0;max-width:22px;min-width:12px;aspect-ratio:1;border-radius:50%;border:1.5px solid ${n<=score?relColor(c.type).c:'var(--border2)'};background:${n<=score?relColor(c.type).c:'var(--bg)'};cursor:pointer;touch-action:manipulation"></div>`).join('')}<span style="font-size:11px;font-weight:700;color:var(--ink3);margin-left:4px">${score||'—'}/10</span></div>${statusHtml}</div><div class="contact-actions"><button class="contact-send-btn" onclick="openKindMessage('${esc(c.name)}')">💌 Send</button><button class="contact-checkin-btn" onclick="markCheckin('${esc(c.name)}')">✓ Seen</button><button onclick="deleteContact(${i})" style="padding:5px 8px;font-size:10px;font-family:'Inter',system-ui,-apple-system,sans-serif;background:none;border:1px solid var(--border2);border-radius:7px;cursor:pointer;color:var(--ink4);touch-action:manipulation">✕</button></div></div>`;
  }).join(''):`<div style="font-size:13px;color:var(--ink4);font-style:italic;padding:8px 0">Add the people who matter most to you</div>`;

  const todaysMsgs=getTodaysMessages();
  const kindCards=todaysMsgs.map((m,idx)=>`<div class="kind-msg-card"><div class="kind-msg-type">${m.emoji} ${m.type}</div><div class="kind-msg-text">${esc(m.text)}</div><div class="kind-msg-actions"><button class="kind-send-btn send-sms" onclick="sendKindByIndex('sms',${m.origIndex})">💬 Text</button><button class="kind-send-btn send-email" onclick="sendKindByIndex('email',${m.origIndex})">📧 Email</button><button class="kind-send-btn send-copy" onclick="sendKindByIndex('copy',${m.origIndex})">📋 Copy</button></div></div>`).join('');

  document.getElementById('viewBody').innerHTML=`
    <div class="post"><div class="post-header"><div class="post-avatar">💡</div><div><div class="post-title">Today's relationship tip</div><div class="post-sub">One thing to practice today</div></div></div><div class="post-body"><div class="comm-tip-card"><div class="comm-tip-label">Today's tip</div><div class="comm-tip-text">${esc(tip)}</div></div><div style="margin-top:12px;background:var(--purple-bg);border-radius:12px;padding:14px"><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin-bottom:8px">Reflect on this</div><div style="font-size:14px;font-weight:500;color:var(--ink2);line-height:1.6;margin-bottom:10px">${esc(dailyQ)}</div><textarea class="ta" id="rel_q_journal" placeholder="Write your thoughts…" rows="2"></textarea><button class="primary-btn" style="font-size:13px;padding:11px;margin-top:8px" onclick="saveRelQ()">Save reflection</button><div class="save-confirm" id="relQConfirm" style="margin-top:6px">Saved ✦</div></div></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">💛</div><div><div class="post-title">Connection tracker</div><div class="post-sub">Your most important people</div></div></div><div class="post-body"><div style="margin-bottom:12px">${connHtml}</div><button class="primary-btn" style="font-size:13px;padding:11px" onclick="openAddContact()">+ Add person</button></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">💌</div><div><div class="post-title">Send something kind</div><div class="post-sub">Today's messages — refreshes daily</div></div></div><div class="post-body">${kindCards}</div></div>`;
}

function setDailyScore(name,score){if(!DB.relationships)return;if(!DB.relationships.dailyScores)DB.relationships.dailyScores={};if(!DB.relationships.dailyScores[today()])DB.relationships.dailyScores[today()]={};DB.relationships.dailyScores[today()][name]=score;saveDB('relationships',DB.relationships);renderRelationships();}
function deleteContact(i){if(!DB.relationships||!DB.relationships.contacts)return;DB.relationships.contacts.splice(i,1);saveDB('relationships',DB.relationships);renderRelationships();}
function openAddContact(){openModal(`<div class="modal-handle"></div><div class="modal-title">Add person</div><div class="fg"><label class="lbl">Name</label><input class="mi-ta" style="min-height:auto;padding:10px 13px" id="c_name" placeholder="e.g. Sarah, Mom, David…"></div><div class="fg"><label class="lbl">Relationship type</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px" id="typeSelector2">${REL_TYPES.map(t=>`<button data-type="${t}" onclick="selRelType(this,'${t}')" style="padding:8px 14px;font-size:12px;font-weight:700;font-family:'Inter',system-ui,-apple-system,sans-serif;border:1.5px solid ${relColor(t).c};border-radius:99px;background:${relColor(t).bg};cursor:pointer;color:${relColor(t).ink};touch-action:manipulation">${t}</button>`).join('')}</div></div><div class="fg"><label class="lbl">How connected do you feel? (1–10)</label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" id="connScoreSelector">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button onclick="selConnScore(this,${n})" style="width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);background:var(--bg);font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer;font-family:'Inter',system-ui,-apple-system,sans-serif;touch-action:manipulation">${n}</button>`).join('')}</div></div><div class="modal-footer"><button class="modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-save" onclick="saveContact()">Add</button></div>`);}
function selRelType(btn,type){document.querySelectorAll('#typeSelector2 button').forEach(b=>{const rc=relColor(b.dataset.type);const on=b===btn;b.style.background=on?rc.c:rc.bg;b.style.borderColor=rc.c;b.style.color=on?'#fff':rc.ink;b.dataset.selected=on?'true':'false';});}
function selConnScore(btn,score){document.querySelectorAll('#connScoreSelector button').forEach(b=>{b.style.background=b===btn?'var(--purple)':'var(--bg)';b.style.borderColor=b===btn?'var(--purple)':'var(--border2)';b.style.color=b===btn?'#fff':'var(--ink3)';b.dataset.selected=b===btn?'true':'false';});btn.dataset.score=score;}
function saveContact(){const name=(document.getElementById('c_name').value||'').trim();if(!name)return;const typeBtn=document.querySelector('#typeSelector2 button[data-selected="true"]');const type=typeBtn?typeBtn.textContent:'Friend';const scoreBtn=document.querySelector('#connScoreSelector button[data-selected="true"]');const score=scoreBtn?parseInt(scoreBtn.dataset.score)||5:5;if(!DB.relationships)DB.relationships={contacts:[],lastCheckins:{},connectionScores:{},dailyScores:{}};DB.relationships.contacts.push({name,type});if(!DB.relationships.dailyScores)DB.relationships.dailyScores={};if(!DB.relationships.dailyScores[today()])DB.relationships.dailyScores[today()]={};DB.relationships.dailyScores[today()][name]=score;saveDB('relationships',DB.relationships);closeModal();renderRelationships();}
function markCheckin(name){if(!DB.relationships)DB.relationships={contacts:[],lastCheckins:{},connectionScores:{}};if(!DB.relationships.lastCheckins)DB.relationships.lastCheckins={};DB.relationships.lastCheckins[name]=today();saveDB('relationships',DB.relationships);renderRelationships();}
function saveRelQ(){const text=(document.getElementById('rel_q_journal').value||'').trim();if(!text)return;if(!DB.relJournal)DB.relJournal=[];DB.relJournal.unshift({id:Date.now().toString(),date:today(),text});saveDB('relJournal',DB.relJournal);const conf=document.getElementById('relQConfirm');conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';},1400);document.getElementById('rel_q_journal').value='';}
function openKindMessage(name){const cards=KIND_MESSAGES.map((m,i)=>`<div style="background:var(--bg);border-radius:10px;padding:12px;margin-bottom:8px"><div style="font-size:11px;font-weight:700;color:var(--purple);margin-bottom:6px">${m.emoji} ${m.type}</div><div style="font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:8px">${esc(m.text)}</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="kind-send-btn send-sms" onclick="sendKindByIndex('sms',${i})">💬 Text</button><button class="kind-send-btn send-email" onclick="sendKindByIndex('email',${i})">📧 Email</button><button class="kind-send-btn send-copy" onclick="sendKindByIndex('copy',${i})">📋 Copy</button></div></div>`).join('');openModal(`<div class="modal-handle"></div><div class="modal-title">Send to ${esc(name)}</div><div style="max-height:60vh;overflow-y:auto">${cards}</div><button class="modal-cancel" onclick="closeModal()" style="width:100%;margin-top:8px">Close</button>`);}
function sendKindByIndex(method,index){const m=KIND_MESSAGES[index];if(!m)return;sendMessage(method,m.text);}
function sendMessage(method,text){if(method==='sms'){window.location.href=(/android/i.test(navigator.userAgent)?'sms:?body=':'sms:&body=')+encodeURIComponent(text);}else if(method==='email'){window.location.href='mailto:?subject='+encodeURIComponent('Thinking of you')+'&body='+encodeURIComponent(text);}else{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>showCopyToast()).catch(()=>fallbackCopy(text));}else{fallbackCopy(text);}}}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:50%;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');showCopyToast();}catch(e){alert('Tap and hold to copy:\n\n'+text);}document.body.removeChild(ta);}
function showCopyToast(){let t=document.getElementById('copyToast');if(!t){t=document.createElement('div');t.id='copyToast';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#272264;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:9999;font-family:Inter,system-ui,sans-serif;pointer-events:none;transition:opacity .3s;opacity:0';t.textContent='Copied ✓';document.body.appendChild(t);}t.style.opacity='1';setTimeout(()=>{t.style.opacity='0';},2200);}

const PROMPT_SETS=[[`Where do you see yourself one year from today?`,`Describe your ideal day in vivid detail.`,`What would you do if you knew you could not fail?`,`Who is the person you are becoming?`,`What does your future self want you to know today?`],[`What are you most proud of right now, even if no one knows about it?`,`What would you do differently if you were completely unafraid?`,`What belief about yourself is ready to be released?`,`Who do you want to be in your closest relationships?`,`What does your version of success actually feel like — not look like?`],[`What chapter of your life are you currently in? What is it teaching you?`,`Where are you playing small and why?`,`What would you start if you stopped waiting to feel ready?`,`What is your body trying to tell you right now?`,`What do you need to forgive yourself for?`],[`What lights you up so much that time disappears?`,`If money and fear weren't factors, what would your life look like?`,`What is the version of you that you're growing into like?`,`What does love look like in your life right now?`,`What is already working that you're not giving yourself credit for?`],];

function renderJournal(){
  const entries=DB.journal||[];
  const weekIdx=weekOfYear()%PROMPT_SETS.length;
  const prompts=PROMPT_SETS[weekIdx];
  let html=`<div class="post"><div class="post-header"><div class="post-avatar">📖</div><div><div class="post-title">Journal & Manifest</div><div class="post-sub">This week's prompts · write freely</div></div></div><div class="post-body"><div class="prompts-scroll">${prompts.map(p=>`<button class="prompt-chip" onclick="usePrompt(this)">${p}</button>`).join('')}</div><textarea class="ta" id="journal_inp" placeholder="Write freely… your thoughts, visions, intentions…" rows="5"></textarea><div style="height:10px"></div><button class="primary-btn" onclick="saveJournal()">Save entry</button><div class="save-confirm" id="journalConfirm" style="margin-top:8px">Entry saved ✦</div></div></div>`;
  if(entries.length){html+=`<div class="past-label">Past entries</div>`;entries.forEach(e=>{html+=`<div class="log-entry"><div class="log-date">${fmtShort(e.date)}</div><div class="log-text">${esc(e.text).replace(/\n/g,'<br>')}</div><div class="log-foot"><button class="del-btn" onclick="deleteJournal('${e.id}')">Delete</button></div></div>`;});}
  document.getElementById('viewBody').innerHTML=html;
}
function usePrompt(btn){const ta=document.getElementById('journal_inp');if(!ta)return;ta.value=ta.value?ta.value+'\n\n'+btn.textContent+'\n':btn.textContent+'\n';ta.focus();ta.scrollTop=ta.scrollHeight;}
function saveJournal(){const text=(document.getElementById('journal_inp').value||'').trim();if(!text)return;if(!DB.journal)DB.journal=[];DB.journal.unshift({id:Date.now().toString(),date:today(),text});saveDB('journal',DB.journal);const conf=document.getElementById('journalConfirm');conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';renderJournal();},1200);}
function deleteJournal(id){tombstone('journal',id);DB.journal=(DB.journal||[]).filter(e=>e.id!==id);saveDB('journal',DB.journal);renderJournal();}

const FALLBACK=[{text:`The secret of getting ahead is getting started.`,author:`Mark Twain`},{text:`You are never too old to set another goal or to dream a new dream.`,author:`C.S. Lewis`},{text:`Believe you can and you're halfway there.`,author:`Theodore Roosevelt`},{text:`Everything you've ever wanted is on the other side of fear.`,author:`George Addair`},{text:`The future belongs to those who believe in the beauty of their dreams.`,author:`Eleanor Roosevelt`},{text:`Start where you are. Use what you have. Do what you can.`,author:`Arthur Ashe`},{text:`The mind is everything. What you think you become.`,author:`Buddha`},{text:`Your life does not get better by chance. It gets better by change.`,author:`Jim Rohn`},{text:`She believed she could, so she did.`,author:`R.S. Grey`},{text:`The comeback is always stronger than the setback.`,author:`Unknown`},{text:`You didn't come this far to only come this far.`,author:`Unknown`},{text:`Be the energy you want to attract.`,author:`Unknown`},{text:`Do something today that your future self will thank you for.`,author:`Sean Patrick Flanery`},{text:`Wake up with determination. Go to bed with satisfaction.`,author:`Unknown`},{text:`You are enough. You have enough. You do enough.`,author:`Brené Brown`},{text:`You were not made for a small life.`,author:`Unknown`},{text:`Stop shrinking yourself to fit places you've outgrown.`,author:`Unknown`},{text:`You are one decision away from a completely different life.`,author:`Mel Robbins`},{text:`Own your morning. Elevate your life.`,author:`Robin Sharma`},{text:`One day or day one. You decide.`,author:`Unknown`},{text:`Dream big. Start small. Act now.`,author:`Robin Sharma`},];

function renderInspire(){if(!currentQuote){currentQuote=FALLBACK[dayOfYear()%FALLBACK.length];}showQuote();fetchQuote().then(()=>showQuote()).catch(()=>{});}
async function fetchQuote(){}
function showQuote(){const el=document.getElementById('viewBody');if(!el)return;const q=currentQuote||FALLBACK[0];el.innerHTML=`<div class="quote-wrap"><div class="quote-card"><div class="quote-mark">"</div><div class="quote-text">${esc(q.text)}</div>${q.author&&!/^unknown$/i.test(q.author)?`<div class="quote-author">— ${esc(q.author)}</div>`:''}</div><button class="new-quote-btn" onclick="newQuote()" style="margin-bottom:12px">✦ New quote</button><div style="background:var(--white);border-radius:14px;padding:16px;border:1px solid var(--border);margin-top:4px"><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin-bottom:10px">Send this quote to someone</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="kind-send-btn send-sms" onclick="sendQuote('sms')" style="flex:1;padding:11px;font-size:13px">💬 Text it</button><button class="kind-send-btn send-email" onclick="sendQuote('email')" style="flex:1;padding:11px;font-size:13px">📧 Email it</button><button class="kind-send-btn send-copy" onclick="sendQuote('copy')" style="flex:1;padding:11px;font-size:13px">📋 Copy</button></div></div></div>`;}
async function newQuote(){const prev=currentQuote;let rand;do{rand=FALLBACK[Math.floor(Math.random()*FALLBACK.length)];}while(rand.text===prev?.text&&FALLBACK.length>1);currentQuote=rand;showQuote();}
function sendQuote(method){const q=currentQuote||FALLBACK[0];const text=q.author&&!/^unknown$/i.test(q.author)?`"${q.text}" — ${q.author}`:`"${q.text}"`;sendMessage(method,text);}

const ENV_AREAS=[{id:'bedroom',emoji:'🛏️',label:'Bedroom',prompts:['Clear the nightstand — keep only what you use every night','Remove clothes from the chair/floor','Check under the bed','Organize your closet — donate anything you haven\'t worn in 6 months','Make your bed every morning, it sets the tone for everything']},{id:'bathroom',emoji:'🪥',label:'Bathroom',prompts:['Clear counters — only what you use daily stays out','Check expiry dates on products and toss what\'s old','Organize under the sink','Wipe down mirrors and surfaces','Restock anything running low']},{id:'kitchen',emoji:'🍳',label:'Kitchen',prompts:['Clear the counter — only appliances you use weekly stay out','Check the fridge and toss anything old','Organize one cabinet or drawer','Wipe down stovetop and counters','Check pantry for expired items']},{id:'living',emoji:'🛋️',label:'Living Room',prompts:['Clear all surfaces — nothing lives on tables that doesn\'t belong','Remove things that don\'t live in this room','Fluff pillows and fold blankets','Dust surfaces','Evaluate: does everything in this room add beauty or function?']},{id:'workspace',emoji:'💻',label:'Workspace',prompts:['Clear your desk — only your computer and what you\'re working on today','File or toss any papers on the desk','Organize cables','Clean your screen','Check your digital desktop too — file or delete what doesn\'t need to be there']},{id:'car',emoji:'🚗',label:'Car',prompts:['Remove any trash or items that don\'t live in the car','Clean out the center console','Wipe down the dashboard','Organize the trunk','Wash or vacuum if needed']},{id:'laundry',emoji:'🧺',label:'Laundry',prompts:['Sort laundry into piles — darks, lights, delicates','Put a load in the wash','Move wet laundry to dryer or hang to dry','Fold and put away anything clean and sitting around','Wipe down the washer and dryer exterior']},{id:'digital',emoji:'📱',label:'Digital Space',prompts:['Delete apps you haven\'t used in 30 days','Unsubscribe from 5 email lists today','Clear your camera roll — back up and delete duplicates','Organize your desktop folders','Delete contacts you no longer need']},];

const PATTERN_QUESTIONS = [
  "What pattern do you suspect is running you right now?",
  "If your data could talk, what would it ask you to notice?",
  "What's one small shift that would change next week's patterns?",
  "Where did you see your old patterns show up this week — and where did you choose differently?",
  "What would you do differently if you trusted what you see here?"
];
const TONE_STYLE = {
  gentle:    {bg:'#f3f2f9', fg:'#272264', label:'gentle'},
  curious:   {bg:'#fff4e5', fg:'#9a5b00', label:'curious'},
  affirming: {bg:'#e9f7ef', fg:'#1e7e46', label:'affirming'}
};

function patternLastNDates(n){
  const out = []; const d = new Date();
  for(let i=0;i<n;i++){ out.push(isoLocal(d)); d.setDate(d.getDate()-1); }
  return out;
}
function patternAvg(a){ return a.length ? a.reduce((s,v)=>s+v,0)/a.length : 0; }

function computePatterns(){
  const days14 = patternLastNDates(14);
  const days7 = days14.slice(0,7);
  const emo = DB.emotional || [];
  const exLogs = DB.exerciseLogs || {};
  const nourishH = DB.nourishHistory || {};
  const journal = DB.journal || [];
  const dailySaved = DB.dailySaved || {};

  const emoByDate = {};
  emo.forEach(e=>{ if(e.date && e.energy != null && e.energy !== '') emoByDate[e.date] = Number(e.energy); });
  const moodByDate = {};
  emo.forEach(e=>{ if(e.date && e.mood) moodByDate[e.date] = {label:e.mood, emoji:e.moodEmoji||''}; });

  const obs = [];
  const activeDays = new Set();
  days14.forEach(dt=>{
    if(emoByDate[dt] != null || exLogs[dt] || dailySaved[dt] || (nourishH[dt]) || journal.some(j=>j.date===dt)) activeDays.add(dt);
  });

  // 1. Energy × Exercise
  const exE = [], restE = [];
  days14.forEach(dt=>{
    const en = emoByDate[dt]; if(en == null) return;
    if(exLogs[dt]) exE.push(en); else restE.push(en);
  });
  if(exE.length >= 2 && restE.length >= 2){
    const d = patternAvg(exE) - patternAvg(restE);
    if(d >= 1){
      obs.push({tone:'affirming',
        text:`Your energy averages <b>${patternAvg(exE).toFixed(1)}</b> on days you move, vs <b>${patternAvg(restE).toFixed(1)}</b> on rest days.`,
        detail:`Across ${exE.length} active days and ${restE.length} rest days in the last two weeks.`});
    } else if(d <= -1){
      obs.push({tone:'curious',
        text:`Interesting — your energy averages <b>${patternAvg(exE).toFixed(1)}</b> on exercise days vs <b>${patternAvg(restE).toFixed(1)}</b> on rest days.`,
        detail:`Across ${exE.length} active days and ${restE.length} rest days. Worth noticing what's different about those workouts.`});
    }
  }

  // 2. Mood of the week
  const moodCount = {};
  days7.forEach(dt=>{ const m = moodByDate[dt]; if(m) { const k = m.label; moodCount[k] = moodCount[k] || {n:0, emoji:m.emoji}; moodCount[k].n++; } });
  const moodEntries = Object.entries(moodCount).sort((a,b)=>b[1].n-a[1].n);
  const totalMoodDays = moodEntries.reduce((s,e)=>s+e[1].n,0);
  if(totalMoodDays >= 3 && moodEntries.length){
    const [topLabel, top] = moodEntries[0];
    const heavy = ['Anxious','Tired','Frustrated','Sad'].includes(topLabel);
    obs.push({tone: heavy ? 'gentle' : 'affirming',
      text:`${top.emoji} <b>${topLabel}</b> showed up ${top.n} of the last ${totalMoodDays} check-ins.`,
      detail: heavy ? `Not a verdict — just data. What's been feeding it this week?` : `Whatever you're doing, it's working. Notice what creates more of this.`});
  }

  // 3. Logging streak
  let streak = 0;
  for(const dt of days14){ if(activeDays.has(dt)) streak++; else break; }
  if(streak >= 3){
    obs.push({tone:'affirming',
      text:`You're on a <b>${streak}-day</b> logging streak.`,
      detail:`Awareness is a practice, and you're practicing it. That's the whole game.`});
  } else if(streak === 0 && activeDays.size > 0){
    obs.push({tone:'gentle',
      text:`You haven't logged in the last day or two — no judgment, just noticing.`,
      detail:`The patterns can only speak when there's data. One small check-in today counts.`});
  }

  // 4. Wins rhythm
  let winDays = 0, winTotal = 0;
  days7.forEach(dt=>{
    const s = dailySaved[dt];
    if(s && s.wins && s.wins.length){ winDays++; winTotal += s.wins.length; }
  });
  if(winDays >= 3){
    obs.push({tone:'affirming',
      text:`You named wins on <b>${winDays} of the last 7 days</b> — averaging ${(winTotal/winDays).toFixed(1)} per day.`,
      detail:`Naming wins trains your brain to spot what's working. Keep going.`});
  }

  // 5. Hydration × Energy
  const hydE = [], dryE = [];
  days14.forEach(dt=>{
    const en = emoByDate[dt]; const h = nourishH[dt];
    if(en == null || !h || h.glasses == null) return;
    if(Number(h.glasses) >= 6) hydE.push(en); else dryE.push(en);
  });
  if(hydE.length >= 2 && dryE.length >= 2 && (patternAvg(hydE) - patternAvg(dryE)) >= 1){
    obs.push({tone:'curious',
      text:`On days you hit 6+ glasses of water, your energy averages <b>${patternAvg(hydE).toFixed(1)}</b> vs <b>${patternAvg(dryE).toFixed(1)}</b>.`,
      detail:`Small inputs, visible outputs. The unglamorous stuff compounds.`});
  }

  // 6. Movement rhythm
  const moveDays = days7.filter(dt=>exLogs[dt]).length;
  if(moveDays >= 4){
    obs.push({tone:'affirming',
      text:`You moved <b>${moveDays} of the last 7 days</b>.`,
      detail:`Consistency beats intensity — your body keeps the score in your favor.`});
  } else if(moveDays === 0 && activeDays.size >= 3){
    obs.push({tone:'gentle',
      text:`No movement logged in the last 7 days.`,
      detail:`Not a scolding — an invitation. Even a 10-minute walk counts as data.`});
  }

  const picked = obs.slice(0, 4);
  const doy = Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0)) / 864e5);
  const question = PATTERN_QUESTIONS[doy % PATTERN_QUESTIONS.length];
  return { observations: picked, question, activeDays: activeDays.size };
}

async function fetchProfile() {
  // Profile now lives in daily_data (DB.profile) — the profiles table is unused.
  _userProfile = (typeof DB !== 'undefined' && DB.profile) || null;
  return _userProfile;
}

async function ensureProfile(user) {
  // Called right after login — creates profile row if it doesn't exist yet
  if (!_sb || !user?.id) return;
  try {
    const { data, error } = await _sb.from('profiles')
      .select('id').eq('id', user.id).maybeSingle();
    if (error && error.code !== 'PGRST116') throw error;
    if (!data) {
      // New user — create their profile row
      await _sb.from('profiles').insert({
        id: user.id,
        email: user.email,
        created_at: new Date().toISOString()
      });
    }
    _userProfile = await fetchProfile();
  } catch (e) {
    console.warn('ensureProfile failed:', e.message);
  }
}

async function saveProfile() {
  const firstName = (document.getElementById('profile_first_name')?.value || '').trim();
  const lastName  = (document.getElementById('profile_last_name')?.value  || '').trim();
  const btn = document.getElementById('profileSaveBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  try {
    const prev = (DB.profile || {});
    saveDB('profile', {
      first_name: firstName,
      last_name:  lastName,
      updated_at: new Date().toISOString(),
      created_at: prev.created_at || new Date().toISOString()
    });
    _userProfile = DB.profile;
    // Update the header avatar if name changed
    updateHeaderAvatar();
    const conf = document.getElementById('profileSaveConfirm');
    if (conf) { conf.style.opacity = '1'; setTimeout(() => conf.style.opacity = '0', 2000); }
  } catch (e) {
    alert('Could not save profile: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Save profile'; }
  }
}

// Downscale an image file to a small JPEG data URL (keeps DB rows light)
function fileToDataUrl(file, maxSize) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objUrl);
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); reject(new Error('could not read that image')); };
    img.src = objUrl;
  });
}

function renderProfile() {
  const p = (DB.profile || {});
  const avatarUrl = DB.avatar || null;
  const initials = [(p.first_name || ''), (p.last_name || '')].filter(Boolean).map(s => s[0]).join('').toUpperCase() || (_currentUser?.email || '?').charAt(0).toUpperCase();
  const memberSince = p.created_at ? new Date(p.created_at).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) : '';

  document.getElementById('viewBody').innerHTML = `
    <div class="post">
      <div class="post-header">
        <div class="post-avatar">👤</div>
        <div><div class="post-title">My profile</div><div class="post-sub">Your account & personal details</div></div>
      </div>
      <div class="post-body">

        <!-- Avatar -->
        <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:24px">
          <div id="avatarDisplay" onclick="document.getElementById('avatarInput').click()" style="width:88px;height:88px;border-radius:50%;background:${avatarUrl ? 'transparent' : 'var(--purple)'};display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;cursor:pointer;overflow:hidden;border:3px solid var(--purple-light);position:relative;margin-bottom:10px">
            ${avatarUrl ? `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : initials}
            <div style="position:absolute;bottom:0;right:0;width:26px;height:26px;background:var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid #fff">📷</div>
          </div>
          <input id="avatarInput" type="file" accept="image/*" style="display:none" onchange="if(this.files[0])uploadAvatar(this.files[0])">
          <div style="font-size:12px;color:var(--ink4)">Tap photo to change</div>
          ${memberSince ? `<div style="font-size:11px;color:var(--ink4);margin-top:4px">Member since ${memberSince}</div>` : ''}
        </div>

        <!-- Name fields -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
          <div>
            <label class="lbl">First name</label>
            <input class="auth-inp" id="profile_first_name" style="margin-bottom:0" placeholder="Anna" value="${esc(p.first_name || '')}">
          </div>
          <div>
            <label class="lbl">Last name</label>
            <input class="auth-inp" id="profile_last_name" style="margin-bottom:0" placeholder="Goldstein" value="${esc(p.last_name || '')}">
          </div>
        </div>

        <!-- Email (read-only) -->
        <div style="margin-bottom:16px">
          <label class="lbl">Email</label>
          <div style="padding:13px 16px;background:var(--bg);border:1.5px solid var(--border);border-radius:14px;font-size:15px;color:var(--ink3)">${esc(_currentUser?.email || '')}</div>
        </div>

        <button class="primary-btn" id="profileSaveBtn" onclick="saveProfile()">Save profile</button>
        <div class="save-confirm" id="profileSaveConfirm" style="margin-top:8px">Profile saved ✦</div>
      </div>
    </div>

    <!-- Account card -->
     <div class="post">
       <div class="post-header">
         <div class="post-avatar">\uD83D\uDC64</div>
         <div><div class="post-title">Account</div><div class="post-sub">Signed in on all devices</div></div>
       </div>
       <div class="post-body">
         <div style="font-size:14px;color:#374151;margin-bottom:12px">${esc(USER_EMAIL||'')}</div>
         <div style="display:flex;gap:8px">
           <button class="primary-btn" onclick="signOut()" style="width:auto;padding:13px 18px;white-space:nowrap">Sign out</button>
         </div>
         <div style="font-size:12px;color:#9ca3af;margin-top:10px;line-height:1.5">Your entries sync automatically to every device where you're signed in.</div>
       </div>
     </div>
     <!-- Stats card -->
    <div class="post">
      <div class="post-header">
        <div class="post-avatar">📊</div>
        <div><div class="post-title">Your daily. stats</div><div class="post-sub">What you've built so far</div></div>
      </div>
      <div class="post-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          ${[
            ['📖', 'Journal entries', (DB.journal||[]).length],
            ['💜', 'Emotional check-ins', (DB.emotional||[]).length],
            ['💪', 'Workouts logged', (DB.exercise||[]).length],
            ['🌙', 'Nightly reflections', Object.keys(DB.nightlyReflections||{}).length],
            ['📅', 'Daily entries saved', Object.keys(DB.dailySaved||{}).length],
            ['💛', 'People tracked', (DB.relationships?.contacts||[]).length],
          ].map(([emoji, label, count]) =>
            `<div style="background:var(--bg);border-radius:12px;padding:14px;text-align:center"><div style="font-size:24px;margin-bottom:4px">${emoji}</div><div style="font-size:26px;font-weight:800;color:var(--purple);margin-bottom:2px">${count}</div><div style="font-size:11px;color:var(--ink3);font-weight:500">${label}</div></div>`
          ).join('')}
        </div>
      </div>
    </div>

    <!-- Danger zone -->
    <div class="post">
      <div class="post-header">
        <div class="post-avatar">⚙️</div>
        <div><div class="post-title">Account</div><div class="post-sub">Settings & sign out</div></div>
      </div>
      <div class="post-body">
        <button onclick="openChangePassword()" style="width:100%;padding:14px;font-size:14px;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:600;background:none;border:1.5px solid var(--border2);border-radius:14px;cursor:pointer;color:var(--ink2);margin-bottom:10px">Change password</button>
        <button onclick="confirmSignOut()" style="width:100%;padding:14px;font-size:14px;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:600;background:none;border:1.5px solid var(--border2);border-radius:14px;cursor:pointer;color:var(--ink2);margin-bottom:10px">Sign out</button>
        <button onclick="confirmDeleteData()" style="width:100%;padding:14px;font-size:14px;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:600;background:none;border:1.5px solid #fca5a5;border-radius:14px;cursor:pointer;color:#dc2626">Clear all local data</button>
      </div>
    </div>`;
}

function confirmDeleteData() {
  openModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">Clear local data?</div>
    <div style="font-size:14px;color:var(--ink3);margin-bottom:20px;line-height:1.5">This clears your locally cached data. Your cloud data in Supabase is safe and will reload on next open.</div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-save" style="background:#ef4444" onclick="closeModal();clearTimeout(_syncTimer);localStorage.removeItem(DB_KEY);location.reload()">Clear</button>
    </div>
  `);
}

// Patch loadDB to also load the profile and ensure it exists
const _origLoadDB = loadDB;
loadDB = async function() {
  await _origLoadDB();
  try{ updateHeaderAvatar(); }catch(e){}
};

// ═══════════════ MODAL ═══════════════
function openModal(html){let ov=document.getElementById('modal-overlay');if(!ov){ov=document.createElement('div');ov.id='modal-overlay';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center';ov.innerHTML='<div id="modal-box" style="background:#fff;border-radius:18px 18px 0 0;padding:24px 20px 40px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto"></div>';ov.addEventListener('click',ev=>{if(ev.target===ov)closeModal()});document.body.appendChild(ov);}document.getElementById('modal-box').innerHTML=html;ov.style.display='flex';}
function closeModal(){const ov=document.getElementById('modal-overlay');if(ov)ov.style.display='none';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ── Patch switchTab to handle 'profile' ──
const _origSwitchTab = switchTab;
switchTab = function(tab, btn) {
  if (tab === 'profile') {
    curTab = 'profile';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (btn) { btn.classList.add('active'); btn.scrollIntoView({ inline: 'center', behavior: 'smooth' }); }
    renderProfile();
    return;
  }
  _origSwitchTab(tab, btn);
};

// ── Patch renderTab for profile ──
const _origRenderTab = renderTab;
renderTab = function() {
  if (curTab === 'profile') { renderProfile(); return; }
  _origRenderTab();
};

// ── Init: sign in first, then load ───────────────────────────────────
(async function init(){
  const tok = await getToken();
  if(!tok){ showAuthScreen(); return; }
  if(_isRecoveryLink){ showNewPasswordScreen(); return; }
  await loadDB();
  await maybeMigrate();
  renderTab();
})();
_sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT'){ showAuthScreen(); } if(event==='PASSWORD_RECOVERY'){ setTimeout(showNewPasswordScreen,0); } });

// ── PWA icon + manifest ───────────────────────────────────────
(function(){
  function makeIcon(size){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="#ffffff"/><text x="50%" y="44%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="${Math.round(size*0.38)}px" font-weight="800" fill="#272264" letter-spacing="-2">daily</text><text x="${Math.round(size*0.86)}%" y="44%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="${Math.round(size*0.42)}px" font-weight="800" fill="#272264">.</text><text x="50%" y="68%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="${Math.round(size*0.12)}px" font-weight="400" fill="#737373" letter-spacing="1">live by design</text></svg>`;return 'data:image/svg+xml;base64,'+btoa(svg);}
  document.getElementById('appIcon').href=makeIcon(180);
  const manifest={name:'daily.',short_name:'daily.',description:'live by design.',start_url:'./',display:'standalone',background_color:'#ffffff',theme_color:'#ffffff',orientation:'portrait',icons:[{src:makeIcon(192),sizes:'192x192',type:'image/svg+xml'},{src:makeIcon(512),sizes:'512x512',type:'image/svg+xml'}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  document.getElementById('appManifest').href=URL.createObjectURL(blob);
})();
</script>
