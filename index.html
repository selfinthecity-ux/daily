<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Daily</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="daily.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" id="appIcon">
<link rel="manifest" id="appManifest">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --white:#ffffff;
  --bg:#f7f6fa;
  --border:#ebe9f3;
  --border2:#d9d6e6;
  --ink:#272264;
  --ink2:#272264;
  --ink3:#56517a;
  --ink4:#8d88a8;
  --purple:#272264;
  --purple-light:#e9e7f3;
  --purple-mid:#b9b5d6;
  --purple-dark:#272264;
  --purple-bg:#f3f2f9;
  --yellow:#fec936;
  --wt:#272264;--wt-bg:#272264;--wt-ink:#fff;
  --cd:#E3418A;--cd-bg:#E3418A;--cd-ink:#fff;
  --wk:#F7873F;--wk-bg:#F7873F;--wk-ink:#272264;
  --st:#FEC936;--st-bg:#FEC936;--st-ink:#272264;
  --pink:#e3418a;
  --orange:#f7873f;
  --display:'Fraunces','Iowan Old Style',Georgia,serif;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:var(--white)}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.header-logo{font-family:var(--display);font-size:24px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.header-logo span{color:var(--pink)}
.header-date{font-size:12px;color:var(--ink3);font-weight:400}
.tab-bar{display:flex;background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;position:sticky;top:53px;z-index:19;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:13px 16px;font-size:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:500;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink3);white-space:nowrap;flex-shrink:0;transition:all .15s;letter-spacing:.01em}
.tab-btn.active{color:var(--purple);border-bottom-color:var(--yellow);border-bottom-width:3px;font-weight:700}
.feed{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.feed-inner{max-width:600px;margin:0 auto;padding:12px 0 60px}
.post{background:var(--white);margin-bottom:8px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.post-header{display:flex;align-items:center;gap:10px;padding:12px 16px}
.post-avatar{width:36px;height:36px;border-radius:50%;background:var(--purple-bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.post-title{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:16px;font-weight:600;color:var(--ink2);letter-spacing:-.005em}
.post-sub{font-size:12px;color:var(--ink3);margin-top:1px}
.post-body{padding:0 16px 16px}
.wins-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.win-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-radius:12px;cursor:pointer;transition:background .12s;touch-action:manipulation}
.win-row.checked{background:var(--purple-bg)}
.win-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:all .2s}
.win-row.checked .win-circle{background:var(--yellow);border-color:var(--yellow);color:var(--purple)}
.win-text{font-size:14px;color:var(--ink2);font-weight:500;flex:1}
.win-row.checked .win-text{color:var(--purple)}
.todo-row.done .win-text{text-decoration:line-through;color:var(--ink4)}
.todo-row.done{background:var(--bg)!important;opacity:.85}
.todo-row.done .win-circle{background:var(--yellow);border-color:var(--yellow);color:var(--purple)}
.todo-count{font-size:12px;font-weight:600;color:var(--ink3);margin:2px 0 10px}
.todo-done-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:6px 2px;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);cursor:pointer}
.add-win-row{display:flex;gap:8px;margin-top:4px}
.add-win-inp{flex:1;padding:11px 14px;font-size:14px;font-family:'Inter',system-ui,-apple-system,sans-serif;border:1.5px solid var(--border2);border-radius:12px;background:var(--white);color:var(--ink);outline:none}
.add-win-inp:focus{border-color:var(--purple-mid)}
.add-win-inp::placeholder{color:var(--ink4)}
.add-win-btn{padding:11px 16px;font-size:13px;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:700;background:var(--purple);color:#fff;border:none;border-radius:12px;cursor:pointer;touch-action:manipulation}
.priority-block{background:var(--purple-bg);border-radius:14px;padding:16px;margin-bottom:8px}
.block-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.block-prompt{font-size:14px;color:var(--ink3);margin-bottom:10px;line-height:1.5;font-weight:400}
.ta{width:100%;padding:12px 14px;font-size:15px;font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.6;border:1.5px solid var(--border2);border-radius:12px;background:var(--white);color:var(--ink);outline:none;resize:none;transition:border-color .2s}
.ta:focus{border-color:var(--purple-mid)}
.ta::placeholder{color:var(--ink4)}
.action-rows{display:flex;flex-direction:column;gap:8px}
.action-row{display:flex;align-items:center;gap:10px}
.action-num{width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.action-inp{flex:1;padding:11px 14px;font-size:14px;font-family:'Inter',system-ui,-apple-system,sans-serif;border:1.5px solid var(--border2);border-radius:12px;background:var(--bg);color:var(--ink);outline:none;transition:border-color .2s;min-width:0}
.action-inp:focus{border-color:var(--purple-mid);background:var(--white)}
.action-inp::placeholder{color:var(--ink4)}
.mindset-block{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:10px}
.mindset-prompt{font-size:15px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.mindset-prefix{font-size:13px;color:var(--ink3);margin-bottom:8px}
.primary-btn{width:100%;padding:15px;font-size:15px;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:700;background:var(--purple);color:#fff;border:none;border-radius:14px;cursor:pointer;touch-action:manipulation;margin-top:4px;letter-spacing:.01em}
.primary-btn:active{opacity:.85}
.save-confirm{font-size:13px;color:var(--purple);text-align:center;opacity:0;transition:opacity .4s;margin-top:8px;font-weight:500}
.contact-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.contact-card{background:var(--bg);border-radius:14px;border:1.5px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px}
.contact-card.overdue{border-color:#f0a0a0;background:#fff5f5}
.contact-avatar{width:42px;height:42px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.contact-info{flex:1;min-width:0}
.contact-name{font-size:15px;font-weight:700;color:var(--ink2)}
.contact-freq{font-size:12px;color:var(--ink3);margin-top:2px}
.contact-due{font-size:11px;font-weight:600;color:#d04040;margin-top:2px}
.contact-actions{display:flex;gap:6px;flex-shrink:0}
.contact-btn{padding:7px 12px;font-size:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:600;border:none;border-radius:8px;cursor:pointer;touch-action:manipulation;background:var(--purple);color:#fff}
.contact-del-btn{background:none;border:1.5px solid var(--border2);color:var(--ink3);padding:7px 10px;font-size:12px;border-radius:8px;cursor:pointer;touch-action:manipulation;font-family:'Inter',system-ui,-apple-system,sans-serif}
.rel-prompts{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.rel-prompt{background:var(--purple-bg);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--purple-dark);font-weight:500;line-height:1.5;font-style:italic}
.kind-types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kind-type-btn{padding:11px 10px;font-size:12px;font-weight:600;font-family:'Inter',system-ui,-apple-system,sans-serif;border:1.5px solid var(--border2);border-radius:10px;background:var(--bg);cursor:pointer;touch-action:manipulation;color:var(--ink2);text-align:center;transition:all .15s;line-height:1.3}
.kind-type-btn.kind-sel{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}
.kind-preview{background:var(--purple-bg);border-radius:12px;padding:16px;font-size:14px;color:var(--ink2);line-height:1.7;font-style:italic;margin-bottom:12px;min-height:60px}
.send-options{display:flex;gap:8px}
.send-sms-btn{flex:1;padding:13px;font-size:14px;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:700;background:var(--purple);color:#fff;border:none;border-radius:12px;cursor:pointer;touch-action:manipulation}
.send-email-btn{flex:1;padding:13px;font-size:14px;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:700;background:var(--ink2);color:#fff;border:none;border-radius:12px;cursor:pointer;touch-action:manipulation}
.thinking-card{background:linear-gradient(135deg,var(--purple-bg),#f0f7f0);border-radius:14px;border:1.5px solid var(--purple-mid);padding:18px;margin-bottom:10px}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;touch-action:manipulation;transition:all .15s}
.mood-btn.mood-sel{border-color:var(--purple);background:var(--purple-bg)}
.mood-emoji{font-size:22px;line-height:1}
.mood-label{font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:.03em}
.mood-btn.mood-sel .mood-label{color:var(--purple)}
.energy-dots{display:flex;gap:6px;flex-wrap:wrap}
.e-dot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border2);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink3);transition:all .15px;touch-action:manipulation}
.e-dot.e-dot-sel{background:var(--purple);border-color:var(--purple);color:#fff}
.plans-list{display:flex;flex-direction:column;gap:8px}
.plan-card{background:var(--bg);border-radius:14px;border:1.5px solid var(--border);overflow:hidden;cursor:pointer;transition:border-color .15s}
.plan-card.plan-open{border-color:var(--purple)}
.plan-card-head{display:flex;align-items:center;gap:12px;padding:14px 16px}
.plan-emoji{font-size:24px;flex-shrink:0}
.plan-title{font-size:15px;font-weight:700;color:var(--ink2)}
.plan-tag{font-size:12px;color:var(--ink3);margin-top:2px}
.plan-chevron{font-size:11px;color:var(--ink4);flex-shrink:0}
.plan-body{padding:0 16px 12px;font-size:13px;color:var(--ink2);line-height:1.8;white-space:pre-wrap;font-family:monospace;background:var(--white);border-top:1px solid var(--border)}
.plan-use-btn{display:block;width:calc(100% - 32px);margin:0 16px 14px;padding:12px;font-size:13px;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:700;background:var(--purple);color:#fff;border:none;border-radius:10px;cursor:pointer;touch-action:manipulation}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.day-pill{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg);cursor:pointer;touch-action:manipulation;transition:all .15s}
.day-pill.weights{background:var(--wt-bg);border-color:var(--wt)}
.day-pill.cardio{background:var(--cd-bg);border-color:var(--cd)}
.day-pill.stretch{background:var(--st-bg);border-color:var(--st)}
.day-pill.walking{background:var(--wk-bg);border-color:var(--wk)}
.day-pill.walking .day-name,.day-pill.walking .day-date,.day-pill.walking .day-type{color:var(--wk-ink)}
.day-pill.rest{background:var(--bg);border-color:var(--border2);border-style:dashed}
.day-pill.weights .day-name,.day-pill.weights .day-date,.day-pill.weights .day-type{color:var(--wt-ink)}
.day-pill.cardio .day-name,.day-pill.cardio .day-date,.day-pill.cardio .day-type{color:var(--cd-ink)}
.day-pill.stretch .day-name,.day-pill.stretch .day-date,.day-pill.stretch .day-type{color:var(--st-ink)}
.day-pill.active-day{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--purple)}
.day-name{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.day-type{font-size:9px;font-weight:600;color:var(--ink3)}
.day-date{font-size:15px;font-weight:700;color:var(--ink);line-height:1}
.day-pill.rest .day-type{color:var(--ink3)}
.day-pill.weights,.day-pill.cardio,.day-pill.walking,.day-pill.stretch{border-width:0;padding:9.5px 5.5px}
.day-pill.active-day{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--purple)!important}

.ex-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--ink2);margin-top:-6px}
.ex-legend span{display:inline-flex;align-items:center;gap:6px}
.ex-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.ex-dot.weights{background:var(--wt-bg)}.ex-dot.cardio{background:var(--cd-bg)}.ex-dot.stretch{background:var(--st-bg)}.ex-dot.walking{background:var(--wk-bg)}
.ex-tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-left:6px;vertical-align:1px}
.ex-tag.weights{background:var(--wt-bg);color:var(--wt-ink)}.ex-tag.cardio{background:var(--cd-bg);color:var(--cd-ink)}.ex-tag.stretch{background:var(--st-bg);color:var(--st-ink)}.ex-tag.walking{background:var(--wk-bg);color:var(--wk-ink)}.ex-tag.rest,.ex-tag.off{background:var(--bg);color:var(--ink3);border:1px solid var(--border2)}
.plan-card.t-weights{border-left:5px solid var(--wt)}.plan-card.t-cardio{border-left:5px solid var(--cd)}.plan-card.t-stretch{border-left:5px solid var(--st)}.plan-card.t-walking{border-left:5px solid var(--wk)}
.type-opt.plan-picked{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple);color:var(--ink)}
.type-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.type-opt{padding:7px 14px;font-size:12px;font-weight:600;font-family:'Inter',system-ui,-apple-system,sans-serif;border:1.5px solid var(--border2);border-radius:99px;background:var(--bg);cursor:pointer;touch-action:manipulation;color:var(--ink3);transition:all .15s}
.type-opt.sel-weights{background:var(--wt-bg);border-color:var(--wt);color:var(--wt-ink)}
.type-opt.sel-cardio{background:var(--cd-bg);border-color:var(--cd);color:var(--cd-ink)}
.type-opt.sel-stretch{background:var(--st-bg);border-color:var(--st);color:var(--st-ink)}
.type-opt.sel-walking{background:var(--wk-bg);border-color:var(--wk);color:var(--wk-ink)}
.type-opt.sel-rest,.type-opt.sel-off{background:var(--white);border-color:var(--ink3);color:var(--ink2)}
.water-tracker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.glass{background:none;border:0;padding:3px;cursor:pointer;touch-action:manipulation;color:#9c97b8;line-height:0}
.glass svg{width:28px;height:34px;display:block}
.glass .fill{fill:var(--yellow);transform-origin:50% 100%;transform:scaleY(0);transition:transform .3s ease}
.glass.filled{color:var(--purple)}
.glass.filled .fill{transform:scaleY(1)}
.water-count{font-size:13px;font-weight:700;color:var(--purple);margin-top:8px;margin-bottom:4px}
.vitamin-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.vitamin-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;cursor:pointer;touch-action:manipulation;transition:background .12s}
.vitamin-row.checked{background:#f3f2f9}
.vitamin-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:all .2s}
.vitamin-row.checked .vitamin-check{background:var(--yellow);border-color:var(--yellow);color:var(--purple)}
.vitamin-name{font-size:14px;font-weight:500;color:var(--ink2)}
.vitamin-row.checked .vitamin-name{color:var(--purple)}
.meal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.meal-slot{background:var(--bg);border-radius:10px;padding:10px 12px;border:1.5px solid var(--border)}
.meal-slot-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.meal-inp{width:100%;font-size:13px;font-family:'Inter',system-ui,-apple-system,sans-serif;border:none;background:transparent;color:var(--ink2);outline:none;padding:0}
.meal-inp::placeholder{color:var(--ink4)}
.meal-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.meal-chip{padding:6px 12px;font-size:12px;font-weight:500;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--purple-bg);border:none;border-radius:99px;color:var(--purple-dark);cursor:pointer;touch-action:manipulation}
.savings-goal-card{background:#f5f5f5;border-radius:14px;padding:18px;margin-bottom:10px;border:1px solid #e0e0e0}
.savings-progress-bar{height:8px;background:var(--purple-light);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.savings-progress-fill{height:100%;background:var(--purple);border-radius:99px;transition:width .4s}
.savings-amounts{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);font-weight:500}
.desire-card{background:var(--purple-bg);border:1.5px solid var(--purple-mid);border-radius:14px;padding:16px;margin-bottom:10px}
.desire-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.past-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:14px 16px 8px}
.log-entry{background:var(--white);border-top:1px solid var(--border);padding:14px 16px}
.log-date{font-size:11px;color:var(--ink4);font-weight:600;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.log-text{font-size:14px;color:var(--ink2);line-height:1.65}
.log-foot{display:flex;justify-content:flex-end;margin-top:10px}
.cat-add-inp{flex:1;padding:7px 10px;font-size:13px;font-family:'Inter',system-ui,-apple-system,sans-serif;border:1.5px solid var(--border2);border-radius:8px;background:var(--white);color:var(--ink);outline:none;min-width:0}
.del-btn{background:none;border:none;font-size:12px;color:var(--ink4);cursor:pointer;font-family:'Inter',system-ui,-apple-system,sans-serif;font-weight:500;touch-action:manipulation}
.empty-state{text-align:center;padding:60px 24px}
.empty-icon{font-size:40px;margin-bottom:14px}
.empty-title{font-size:17px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.empty-sub{font-size:14px;color:var(--ink3);line-height:1.6}
.prompts-scroll{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}

function friendlyAuthError(e){
  const m=(e&&e.message)||'', c=(e&&e.code)||'';
  if(c==='invalid_credentials'||/invalid login credentials/i.test(m)) return 'That email and password don\'t match. Tap Show to check for typos, or tap Forgot password? to set a new one.';

  if(c==='email_address_not_authorized'||/not authorized/i.test(m)) return 'We couldn\'t send your email right now. Please try again later or contact support.';
  if(/rate limit|security purposes/i.test(m)) return 'Too many tries in a short time. Wait a few minutes and try again.';
  if(c==='weak_password'||/password should be/i.test(m)) return 'Choose a password with at least 6 characters.';

  return m||'Something went wrong. Try again.';

function tombstone(key,id){ if(!DB._deleted) DB._deleted={}; DB._deleted[key+':'+id]=Date.now(); }
// Merge two copies: arrays of entries are combined, dated entries kept from both,
// "primary" wins where both changed the same thing; deletions stay deleted.
function mergeDB(primary, secondary){
  if(!secondary) return primary; if(!primary) return secondary;
  const out = deepMergeDB(primary, secondary);
  const dead = {...(secondary._deleted||{}), ...(primary._deleted||{})};
  out._deleted = dead;
  for(const k of Object.keys(dead)){
    const i=k.indexOf(':'); const key=k.slice(0,i), id=k.slice(i+1);
    if(Array.isArray(out[key])) out[key]=out[key].filter(e=>!(e&&String(e.id)===id));
    else if(out[key] && typeof out[key]==='object' && id in out[key]){ out[key]={...out[key]}; delete out[key][id]; }
  }
  out._ts = Math.max(primary._ts||0, secondary._ts||0);
  return out;
}

  const out = {...localD};
  const ARR = ['emotional','journal','dailyLog','nightlyReflections','relJournal'];
  const skey = (e)=> (e && typeof e==='object') ? (e.id || JSON.stringify(e).slice(0,200)) : String(e).slice(0,200);
  for(const k of Object.keys(staged)){
    const sv = staged[k];
    if(sv==null) continue;
    const lv = out[k];
    if(k==='todos' && Array.isArray(sv)){
      const byId={};
      [...sv, ...(Array.isArray(lv)?lv:[])].forEach(t=>{ if(!t||!t.id) return; const cur=byId[t.id]; if(!cur || (t.u||0) >= (cur.u||0)) byId[t.id]=t; });
      out[k]=Object.values(byId).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    } else if(ARR.includes(k) && Array.isArray(sv)){
      const cur = Array.isArray(lv) ? lv.slice() : [];
      const seen = new Set(cur.map(skey));
      sv.forEach(e=>{ const sk=skey(e); if(!seen.has(sk)){ seen.add(sk); cur.push(e); } });
      cur.sort((a,b)=> String((b&&b.date)||'').localeCompare(String((a&&a.date)||'')));
      out[k]=cur;
    } else if(sv && typeof sv==='object' && !Array.isArray(sv)){
      out[k] = {...sv, ...(lv && typeof lv==='object' && !Array.isArray(lv) ? lv : {})};
    } else if(lv==null || lv===''){ out[k]=sv; }
  }
  return out;
}

const LEGACY_DB_KEY = 'daily_v2';
let DB_KEY = LEGACY_DB_KEY;
const OLD_SESSION_KEY = 'sb-dkfupewqymuolhisdzmp-auth-token'; // sign-in from the previous database
let _carriedOver = false;
function useAccountStorage(){
  if(!USER_ID) return;
  DB_KEY = 'daily_v2_' + USER_ID;
  try{
    if(localStorage.getItem(DB_KEY)) return;
    // Bring this person's entries across from the previous database, but only when they sign in
    // with the same email they used there, so nobody else on a shared device can pick them up.
    let old = null;
    try{ const t = JSON.parse(localStorage.getItem(OLD_SESSION_KEY)||'null'); old = t && (t.user || (t.currentSession && t.currentSession.user)); }catch(e){}
    let copy = null, oldKeys = [];
    if(old && old.email && USER_EMAIL && old.email.toLowerCase() === USER_EMAIL.toLowerCase()){
      oldKeys = ['daily_v2_' + old.id, LEGACY_DB_KEY, OLD_SESSION_KEY];
      copy = localStorage.getItem('daily_v2_' + old.id) || localStorage.getItem(LEGACY_DB_KEY);
    } else if(!old){
      oldKeys = [LEGACY_DB_KEY];
      copy = localStorage.getItem(LEGACY_DB_KEY);
    }
    if(copy){ localStorage.setItem(DB_KEY, copy); _carriedOver = true; }
    if(copy || (old && oldKeys.length)) oldKeys.forEach(k => localStorage.removeItem(k));
  }catch(e){}
}
let DB = {};

function saveDB(key, value){
  DB[key] = value;
  DB._ts = Date.now();
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  if(_sb && USER_ID){ setSyncStatus('saving'); clearTimeout(_syncTimer); _syncTimer = setTimeout(pushToSupabase, 1500); }
}

async function pushToSupabase(){
  if(!USER_ID) return;
  const _tok = await getToken();
  if(!_tok) return;
  _syncPending = false;
  try {
    // Another device may have saved since we last synced: fold its changes in first
    try{
      const remote = await fetchRemoteDB();
      if(remote && (remote._ts||0) > _lastSyncedTs && remote._ts !== DB._ts){
        DB = mergeDB(DB, remote); DB._ts = Date.now();
        localStorage.setItem(DB_KEY, JSON.stringify(DB));
      }
    }catch(e){ throw e; }
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/daily_data`,
      {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON,
          'Authorization': 'Bearer ' + _tok,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify({ user_id: USER_ID, data: DB, updated_at: new Date().toISOString() })
      }
    );
    if(!res.ok) throw new Error('HTTP ' + res.status);
    _lastSyncedTs = DB._ts || 0;
    setSyncStatus('saved');
    setTimeout(()=>setSyncStatus('idle'), 3000);
  } catch(e){
    console.warn('Supabase push failed:', e.message);
    setSyncStatus(navigator.onLine ? 'error' : 'offline');
    if(navigator.onLine) setTimeout(()=>pushToSupabase(), 10000);
  }
}

async function pullFromSupabase(){
  if(!USER_ID) return false;
  const _tok = await getToken();
  if(!_tok) return false;
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/daily_data?select=data&user_id=eq.${encodeURIComponent(USER_ID)}&limit=1`,
      { headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + _tok, 'Accept': 'application/json' } }
    );
    if(!res.ok) return false;
    const rows = await res.json();
    if(rows && rows.length && rows[0].data){
      const remote = rows[0].data;
      const localNewer = (DB._ts||0) > (remote._ts||0) && Object.keys(DB).length>2;
      DB = localNewer ? mergeDB(DB, remote) : mergeDB(remote, DB);
      _lastSyncedTs = remote._ts || 0;
      localStorage.setItem(DB_KEY, JSON.stringify(DB));
      if(localNewer) _carriedOver = true;
      return true;
    }
  } catch(e){ console.warn('Supabase pull failed:', e.message); }
  return false;
}

async function refreshFromCloud(){
  if(!_sb || !USER_ID || document.hidden) return;
  try{
    const remote = await fetchRemoteDB();
    if(!remote || (remote._ts||0) <= (DB._ts||0)) return;
    DB = mergeDB(remote, DB); _lastSyncedTs = remote._ts||0;

}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return isoLocal(new Date())}
// New day starts at local midnight
function todayResetKey(){return today()}
// Week runs Sunday–Saturday; new week starts Sunday at 12am
function weekStartKey(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-d.getDay());return isoLocal(d)}
function rollWeek(){
  const ws=weekStartKey();
  if(!DB.scheduleWeek){DB.scheduleWeek=ws;return false;}
  if(DB.scheduleWeek===ws)return false;
  const prev=DB.exerciseSchedule||{};
  if(Object.keys(prev).some(k=>prev[k])){if(!DB.exerciseWeeks)DB.exerciseWeeks={};DB.exerciseWeeks[DB.scheduleWeek]=prev;}
  DB.exerciseSchedule={};DB.scheduleWeek=ws;
  return true;
}
const KEEP_DAYS=730;
function keepRecent(obj){const o={};Object.keys(obj||{}).sort().reverse().slice(0,KEEP_DAYS).forEach(k=>o[k]=obj[k]);return o;}
function fmtFull(iso){if(!iso)return'';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
function fmtShort(iso){if(!iso)return'';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase()}
function dayOfYear(){return Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/(864e5));}
function weekOfYear(){return Math.floor(dayOfYear()/7);}

  const actionList=(DB.todayActions||[]).filter(a=>a&&a.trim());
  const prev=(DB.dailySaved||{})[dateStr]||{};

  }
  if(DB.todayWorkoutType){if(!DB.workoutTypeHistory)DB.workoutTypeHistory={};DB.workoutTypeHistory[dateStr]=DB.todayWorkoutType;}

  if(wasChecked)checkedWins.delete(i);else{checkedWins.add(i);burstConfetti();}
  saveDB('todayCheckedWins',Array.from(checkedWins));
  renderWins();
}

let _tapX=null,_tapY=null;
document.addEventListener('pointerdown',e=>{_tapX=e.clientX;_tapY=e.clientY;},true);
function burstConfetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let cv=document.getElementById('confettiCanvas');
  if(!cv){cv=document.createElement('canvas');cv.id='confettiCanvas';cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';document.body.appendChild(cv);}
  const ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const x=_tapX??innerWidth/2,y=_tapY??innerHeight/3;
  const cols=['#272264','#fec936','#e3418a','#f7873f'];
  const ps=Array.from({length:42},()=>({x,y,vx:(Math.random()-.5)*9,vy:-Math.random()*8-2,s:Math.random()*5+4,c:cols[Math.random()*4|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let f=0;
  (function tick(){ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.max(0,1-f/70);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(++f<70)requestAnimationFrame(tick);else ctx.clearRect(0,0,innerWidth,innerHeight);})();
}

function deleteWin(i){
  wins.splice(i,1);
  const newChecked=new Set();
  checkedWins.forEach(idx=>{if(idx<i)newChecked.add(idx);else if(idx>i)newChecked.add(idx-1);});
  checkedWins=newChecked;
  saveDB('wins',wins);
  renderWins();
}

function addCustomWin(){
  const inp=document.getElementById('customWinInp');
  const val=(inp.value||'').trim();if(!val)return;
  wins.push(val);saveDB('wins',wins);inp.value='';renderWins();
}

function renderActions(){
  const el=document.getElementById('actionRows');if(!el)return;
  el.innerHTML=actions.map((a,i)=>`
    <div class="action-row">
      <div class="action-num">${i+1}</div>
      <input class="action-inp" type="text" value="${esc(a)}" placeholder="Action ${i+1}…" oninput="actions[${i}]=this.value;saveDB('todayActions',[...actions]);autoSaveDaily()">
    </div>`).join('');
}

let _dailyTimer=null;
function autoSaveDaily(){clearTimeout(_dailyTimer);_dailyTimer=setTimeout(()=>saveDaily(true),800);}
function saveDaily(silent){
  const t=today();
  if(!document.getElementById('inp_priority'))return;
  const priority=(document.getElementById('inp_priority').value||'').trim();
  const showup=(document.getElementById('inp_showup').value||'').trim();
  const value=(document.getElementById('inp_value').value||'').trim();
  const actionList=actions.filter(a=>a.trim());
  const winsChecked=Array.from(checkedWins).map(i=>wins[i]);
  if(!priority&&!showup&&!value&&!actionList.length&&!winsChecked.length)return;
  if(!DB.dailySaved)DB.dailySaved={};
  DB.dailySaved[t]={priority,showup,value,actions:actionList,wins:winsChecked,savedAt:Date.now()};
  DB.dailySaved=keepRecent(DB.dailySaved);
  saveDB('dailySaved',DB.dailySaved);
  if(!DB.dailyLog)DB.dailyLog=[];
  DB.dailyLog=DB.dailyLog.filter(e=>e.date!==t);
  DB.dailyLog.unshift({id:Date.now().toString(),date:t,wins:winsChecked,priority,actions:actionList,showup,value});
  saveDB('dailyLog',DB.dailyLog);
  if(silent===true)return;
  const conf=document.getElementById('saveConfirm');
  conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';},2600);
}

let expandedPlan=null;
function exType(v){if(!v)return'';if(WORKOUT_TYPES.includes(v))return v;const p=WORKOUT_PLANS.find(x=>x.id===v);return p?p.type:v;}
const EX_LEGEND='<div class="ex-legend"><span><i class="ex-dot weights"></i>Weights</span><span><i class="ex-dot cardio"></i>Cardio</span><span><i class="ex-dot walking"></i>Walking</span><span><i class="ex-dot stretch"></i>Stretch</span></div>';

    });
  }
  const customPlans=DB.customWorkoutPlans||[];
  const customPlanCards=customPlans.map((p,i)=>{
    const isOpen=expandedPlan==='custom_'+i;
    return`<div class="plan-card${isOpen?' plan-open':''}" onclick="togglePlan('custom_'+${i})"><div class="plan-card-head"><div class="plan-emoji">${p.emoji||'⚡'}</div><div style="flex:1"><div class="plan-title">${esc(p.title)}</div><div class="plan-tag">${esc(p.tag||'')}</div></div><div style="display:flex;align-items:center;gap:8px"><button onclick="event.stopPropagation();deleteCustomPlan(${i})" style="background:none;border:none;color:var(--ink4);font-size:16px;cursor:pointer;padding:2px 6px;touch-action:manipulation">×</button><div class="plan-chevron">${isOpen?'▲':'▼'}</div></div></div>${isOpen?`<div class="plan-body">${esc(p.content).replace(/\n/g,'<br>')}</div><button class="plan-use-btn" onclick="event.stopPropagation();useCustomPlan(${i})">Use this plan today ↓</button>`:''}</div>`;
  }).join('');
  const todayType=DB.todayWorkoutType||'';
  const typeSelHtml=WORKOUT_TYPES.map(t=>`<button class="type-opt today-type-btn${todayType===t?' sel-'+t:''}" data-type="${t}" onclick="setTodayType('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('');

    <div class="post"><div class="post-header"><div class="post-avatar">💪</div><div><div class="post-title">Today's workout</div><div class="post-sub">${todayDay} · what did you do?</div></div></div><div class="post-body"><div style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">Workout type</div><div class="type-selector">${typeSelHtml}</div></div><textarea class="ta" id="ex_log" placeholder="Write your workout… sets, reps, how it felt." rows="4">${esc(todayWorkout)}</textarea><div style="height:10px"></div><button class="primary-btn" onclick="saveExercise()">Save workout</button><div class="save-confirm" id="exConfirm" style="margin-top:8px">Workout saved ✦</div></div></div>

function togglePlan(id){expandedPlan=expandedPlan===id?null:id;renderExercise();setTimeout(()=>{const el=document.querySelector('.plan-open');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},50);}
function setTodayType(type){DB.todayWorkoutType=type;saveDB('todayWorkoutType',type);document.querySelectorAll('.today-type-btn').forEach(b=>{const t=b.dataset.type;b.className='type-opt today-type-btn'+(t===type?' sel-'+t:'');});const todayDay=DAYS[new Date().getDay()];const TYPE_LABELS={weights:'Wts',cardio:'Crd',walking:'Walk',stretch:'Str',rest:'Rest',off:'Off'};document.querySelectorAll('.day-pill').forEach((pill,i)=>{if(DAYS[i]===todayDay){const typeEl=pill.querySelector('.day-type');if(typeEl)typeEl.textContent=TYPE_LABELS[type]||type;pill.className='day-pill '+type+' active-day';}});}
function saveCustomPlan(){const title=(document.getElementById('cp_title').value||'').trim();if(!title)return;const emoji=(document.getElementById('cp_emoji').value||'').trim()||'⚡';const tag=(document.getElementById('cp_tag').value||'').trim();const content=(document.getElementById('cp_content').value||'').trim();if(!DB.customWorkoutPlans)DB.customWorkoutPlans=[];DB.customWorkoutPlans.unshift({title,emoji,tag,content});saveDB('customWorkoutPlans',DB.customWorkoutPlans);const conf=document.getElementById('cpConfirm');conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';renderExercise();},1200);}
function deleteCustomPlan(i){if(!DB.customWorkoutPlans)return;DB.customWorkoutPlans.splice(i,1);saveDB('customWorkoutPlans',DB.customWorkoutPlans);expandedPlan=null;renderExercise();}
function useCustomPlan(i){const plan=(DB.customWorkoutPlans||[])[i];if(!plan)return;const ta=document.getElementById('ex_log');if(ta){ta.value=plan.content;ta.scrollIntoView({behavior:'smooth'});}}
function usePlan(id){const plan=WORKOUT_PLANS.find(p=>p.id===id);if(!plan)return;const ta=document.getElementById('ex_log');if(ta){ta.value=plan.content;ta.scrollIntoView({behavior:'smooth'});}}
function editDaySchedule(day){const schedule=DB.exerciseSchedule||{};const current=exType(schedule[day]||'');const curPlan=schedule[day+'_plan']||schedule[day]||'';const planOpts=WORKOUT_PLANS.map(p=>`<button class="type-opt${curPlan===p.id?' plan-picked':''}" data-plan-id="${p.id}" onclick="setDayPlan('${day}','${p.id}',this)" style="display:flex;align-items:center;gap:6px;width:100%;margin-bottom:6px;padding:10px 14px;border-radius:10px;font-size:13px"><span>${p.emoji}</span><span>${p.title}</span></button>`).join('');const typeOpts=WORKOUT_TYPES.map(t=>`<button class="type-opt${current===t?' sel-'+t:''}" onclick="setDayType('${day}','${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('');openModal(`<div class="modal-handle"></div><div class="modal-title">${day} — assign workout</div><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">Quick type</div><div class="type-selector" id="typeSelector" style="margin-bottom:16px">${typeOpts}</div><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">Assign a plan</div><div id="planSelector">${planOpts}</div><div class="fg" style="margin-top:12px"><label class="lbl">Custom notes</label><textarea class="mi-ta" id="day_notes" placeholder="e.g. Push day — chest, shoulders, triceps">${esc(schedule[day+'_notes']||'')}</textarea></div><div class="modal-footer"><button class="modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-save" onclick="saveDaySchedule('${day}')">Save</button></div>`);}
function setDayPlan(day,planId,btn){document.querySelectorAll('#planSelector .type-opt').forEach(b=>b.classList.remove('plan-picked'));btn.classList.add('plan-picked');btn.dataset.planId=planId;const t=exType(planId);document.querySelectorAll('#typeSelector .type-opt').forEach(b=>{b.className='type-opt'+(b.textContent.toLowerCase()===t?' sel-'+t:'');});}
function setDayType(day,type){document.querySelectorAll('#typeSelector .type-opt').forEach(b=>{b.className='type-opt'+(b.textContent.toLowerCase()===type?' sel-'+type:'');});document.querySelectorAll('#planSelector .type-opt').forEach(b=>b.classList.remove('plan-picked'));}
function saveDaySchedule(day){if(!DB.exerciseSchedule)DB.exerciseSchedule={};const selectedPlan=document.querySelector('#planSelector .plan-picked');const selectedType=document.querySelector('#typeSelector .type-opt[class*="sel-"]');if(selectedPlan&&selectedPlan.dataset.planId){DB.exerciseSchedule[day]=exType(selectedPlan.dataset.planId);DB.exerciseSchedule[day+'_plan']=selectedPlan.dataset.planId;}else if(selectedType){DB.exerciseSchedule[day]=selectedType.textContent.toLowerCase();delete DB.exerciseSchedule[day+'_plan'];}DB.exerciseSchedule[day+'_notes']=(document.getElementById('day_notes').value||'').trim();saveDB('exerciseSchedule',DB.exerciseSchedule);closeModal();renderExercise();}
function saveExercise(){const log=(document.getElementById('ex_log').value||'').trim();if(!log)return;const todayStr=today();const todayDay=DAYS[new Date().getDay()];if(!DB.exerciseLogs)DB.exerciseLogs={};DB.exerciseLogs[todayStr]=log;DB.exerciseLogs=keepRecent(DB.exerciseLogs);saveDB('exerciseLogs',DB.exerciseLogs);const selectedType=DB.todayWorkoutType||'';if(selectedType){if(!DB.exerciseSchedule)DB.exerciseSchedule={};DB.exerciseSchedule[todayDay]=selectedType;saveDB('exerciseSchedule',DB.exerciseSchedule);}if(!DB.exercise)DB.exercise=[];const type=selectedType||(DB.exerciseSchedule||{})[todayDay]||'';DB.exercise=DB.exercise.filter(e=>e.date!==todayStr);DB.exercise.unshift({id:Date.now().toString(),date:todayStr,type,log});saveDB('exercise',DB.exercise);renderExercise();const conf=document.getElementById('exConfirm');conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';},1400);}
function deleteExercise(id){DB.exercise=(DB.exercise||[]).filter(e=>e.id!==id);saveDB('exercise',DB.exercise);renderExercise();}

// ═══════════════ NOURISHMENT ═══════════════
const MEAL_SUGGESTIONS=['Overnight oats','Greek yogurt + berries','Avocado toast','Grilled salmon + greens','Chicken + quinoa','Veggie stir fry','Smoothie bowl','Lentil soup'];
const MEAL_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function initNourish(){
  if(!DB.nourish)DB.nourish={glasses:0,vitaminChecks:{},meals:{breakfast:'',lunch:'',dinner:'',snack:''},vitaminList:[],recipes:[],foodPrepSchedule:{}};
  if(!DB.nourish.foodPrepSchedule)DB.nourish.foodPrepSchedule={};
  if(!DB.nourish.vitaminList)DB.nourish.vitaminList=[];
  if(!DB.nourish.recipes)DB.nourish.recipes=[];
  if(DB.nourish.vitamins&&!DB.nourish.vitaminChecks){DB.nourish.vitaminChecks=DB.nourish.vitamins;delete DB.nourish.vitamins;}
  if(!DB.nourish.vitaminChecks)DB.nourish.vitaminChecks={};
  if(DB.nourish.vitaminChecksDate!==today()){DB.nourish.vitaminChecks={};DB.nourish.vitaminChecksDate=today();}
}

function renderNourish(){
  initNourish();
  const n=DB.nourish;
  const glasses=n.glasses||0;
  const todayMealDay=MEAL_DAYS[new Date().getDay()===0?6:new Date().getDay()-1];
  const glassHtml=Array.from({length:8},(_,i)=>`<button type="button" class="glass${i<glasses?' filled':''}" onclick="toggleGlass(${i})" aria-label="Glass ${i+1}"><svg viewBox="0 0 30 36" aria-hidden="true"><path class="fill" d="M7.2 14h15.6l-1.6 18H8.8z"/><path d="M5 3h20l-2.6 30H7.6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>`).join('');
  const vitaminHtml=n.vitaminList.length?n.vitaminList.map((v,i)=>`<div class="vitamin-row${n.vitaminChecks[v]?' checked':''}"><div style="display:flex;align-items:center;gap:10px;flex:1" onclick="toggleVitamin('${v.replace(/'/g,"\\'")}')"><div class="vitamin-check">${n.vitaminChecks[v]?'✓':''}</div><div class="vitamin-name">${esc(v)}</div></div><button onclick="removeVitamin(${i})" style="background:none;border:none;color:var(--ink4);cursor:pointer;font-size:14px;padding:4px 8px;touch-action:manipulation">✕</button></div>`).join(''):`<div style="font-size:13px;color:var(--ink4);font-style:italic;padding:8px 0">No vitamins added yet</div>`;
  const suggestHtml=MEAL_SUGGESTIONS.map(m=>`<button class="meal-chip" onclick="useMealSuggestion('${m}')">${m}</button>`).join('');
  const prepGrid=MEAL_DAYS.map(d=>{const prep=n.foodPrepSchedule[d]||'';const isToday=d===todayMealDay;return`<div style="background:${isToday?'var(--purple-bg)':'var(--bg)'};border-radius:10px;padding:10px 12px;border:1.5px solid ${isToday?'var(--purple-mid)':'var(--border)'}"><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${isToday?'var(--purple)':'var(--ink3)'};margin-bottom:4px">${d}</div><input style="width:100%;font-size:12px;font-family:'Inter',system-ui,-apple-system,sans-serif;border:none;background:transparent;color:var(--ink2);outline:none;padding:0" placeholder="What to prep…" value="${esc(prep)}" onchange="savePrepDay('${d}',this.value)"></div>`;}).join('');
  const recipesHtml=(n.recipes||[]).length?`<div style="margin-bottom:12px">${n.recipes.map((r,i)=>`<div style="background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px"><div style="flex:1"><div style="font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:3px">${esc(r.name)}</div>${r.notes?`<div style="font-size:12px;color:var(--ink3);line-height:1.5">${esc(r.notes)}</div>`:''}</div><div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0"><button onclick="addRecipeToMeal('${esc(r.name)}')" style="padding:5px 10px;font-size:11px;font-weight:700;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--purple);color:#fff;border:none;border-radius:7px;cursor:pointer;white-space:nowrap">+ Add to meal</button><button onclick="deleteRecipe(${i})" style="padding:5px 10px;font-size:11px;font-family:'Inter',system-ui,-apple-system,sans-serif;background:none;border:1px solid var(--border2);border-radius:7px;cursor:pointer;color:var(--ink4)">Delete</button></div></div>`).join('')}</div>`:` <div style="font-size:13px;color:var(--ink4);font-style:italic;padding:4px 0 10px">No recipes saved yet</div>`;
  document.getElementById('viewBody').innerHTML=`
    <div class="post"><div class="post-header"><div class="post-avatar">💧</div><div><div class="post-title">Water intake</div><div class="post-sub">Tap each glass as you drink it</div></div></div><div class="post-body"><div class="water-tracker">${glassHtml}</div><div class="water-count">${glasses} of 8 glasses · ${glasses*8} oz</div></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">💊</div><div><div class="post-title">Vitamins & supplements</div><div class="post-sub">Your daily checklist</div></div></div><div class="post-body"><div class="vitamin-list">${vitaminHtml}</div><div class="add-win-row" style="margin-top:10px"><input class="add-win-inp" id="vitaminInp" placeholder="Add a vitamin or supplement…" onkeydown="if(event.key==='Enter')addVitamin()"><button class="add-win-btn" onclick="addVitamin()">+ Add</button></div></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">🌿</div><div><div class="post-title">Meals today</div><div class="post-sub">Log what you ate</div></div></div><div class="post-body"><div class="meal-suggestions">${suggestHtml}</div><div class="meal-grid"><div class="meal-slot"><div class="meal-slot-label">Breakfast</div><input class="meal-inp" id="meal_breakfast" placeholder="What did you have?" value="${esc(n.meals.breakfast||'')}"></div><div class="meal-slot"><div class="meal-slot-label">Lunch</div><input class="meal-inp" id="meal_lunch" placeholder="What did you have?" value="${esc(n.meals.lunch||'')}"></div><div class="meal-slot"><div class="meal-slot-label">Dinner</div><input class="meal-inp" id="meal_dinner" placeholder="What did you have?" value="${esc(n.meals.dinner||'')}"></div><div class="meal-slot"><div class="meal-slot-label">Snack</div><input class="meal-inp" id="meal_snack" placeholder="Any snacks?" value="${esc(n.meals.snack||'')}"></div></div><button class="primary-btn" onclick="saveMeals()">Save meals</button><div class="save-confirm" id="nourishConfirm" style="margin-top:8px">Saved ✦</div></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">📖</div><div><div class="post-title">Recipe box</div><div class="post-sub">Save your go-to meals</div></div></div><div class="post-body">${recipesHtml}<div style="background:var(--purple-bg);border-radius:12px;padding:14px;margin-top:4px"><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin-bottom:10px">Add recipe</div><input class="ta" style="min-height:auto;padding:11px 13px;margin-bottom:8px" id="recipe_name" placeholder="Recipe name"><textarea class="ta" id="recipe_notes" placeholder="Ingredients, steps, or notes…" rows="3"></textarea><button class="primary-btn" style="margin-top:10px;font-size:13px;padding:11px" onclick="saveRecipe()">Save recipe</button><div class="save-confirm" id="recipeConfirm" style="margin-top:6px">Recipe saved ✦</div></div></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">🥗</div><div><div class="post-title">Food prep schedule</div><div class="post-sub">Plan what to prep each day</div></div></div><div class="post-body"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">${prepGrid}</div><div class="save-confirm" id="prepConfirm" style="margin-top:4px;opacity:0">Saved ✦</div></div></div>`;
}

function savePrepDay(day,value){initNourish();DB.nourish.foodPrepSchedule[day]=value.trim();saveDB('nourish',DB.nourish);const conf=document.getElementById('prepConfirm');if(conf){conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';},1200);}}
function saveRecipe(){const name=(document.getElementById('recipe_name').value||'').trim();if(!name)return;const notes=(document.getElementById('recipe_notes').value||'').trim();initNourish();DB.nourish.recipes.unshift({name,notes,id:Date.now().toString()});saveDB('nourish',DB.nourish);const conf=document.getElementById('recipeConfirm');if(conf){conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';renderNourish();},1200);}}
function deleteRecipe(i){initNourish();DB.nourish.recipes.splice(i,1);saveDB('nourish',DB.nourish);renderNourish();}
function addRecipeToMeal(name){const slots=['breakfast','lunch','dinner','snack'];for(const s of slots){const el=document.getElementById('meal_'+s);if(el&&!el.value){el.value=name;break;}}}
function toggleGlass(i){initNourish();const current=DB.nourish.glasses||0;DB.nourish.glasses=i<current?i:i+1;saveDB('nourish',DB.nourish);renderNourish();}
function toggleVitamin(name){initNourish();const wasChecked=DB.nourish.vitaminChecks[name];DB.nourish.vitaminChecks[name]=!wasChecked;if(!wasChecked)burstConfetti();saveDB('nourish',DB.nourish);renderNourish();}
function addVitamin(){const inp=document.getElementById('vitaminInp');const val=(inp.value||'').trim();if(!val)return;initNourish();if(!DB.nourish.vitaminList.includes(val)){DB.nourish.vitaminList.push(val);saveDB('nourish',DB.nourish);}inp.value='';renderNourish();}
function removeVitamin(i){initNourish();const name=DB.nourish.vitaminList[i];DB.nourish.vitaminList.splice(i,1);delete DB.nourish.vitaminChecks[name];saveDB('nourish',DB.nourish);renderNourish();}
function useMealSuggestion(meal){const slots=['breakfast','lunch','dinner','snack'];for(const s of slots){const el=document.getElementById('meal_'+s);if(el&&!el.value){el.value=meal;break;}}}
function saveMeals(){initNourish();DB.nourish.meals={breakfast:(document.getElementById('meal_breakfast').value||'').trim(),lunch:(document.getElementById('meal_lunch').value||'').trim(),dinner:(document.getElementById('meal_dinner').value||'').trim(),snack:(document.getElementById('meal_snack').value||'').trim()};saveDB('nourish',DB.nourish);const conf=document.getElementById('nourishConfirm');conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';},1400);}

// ═══════════════ FINANCIAL ═══════════════
function initFinancial(){
  if(!DB.financial)DB.financial={savings:{goal:0,saved:0},desire:{item:'',cost:0,saved:0},mindset:'',spending:{}};
  if(!DB.financial.savings)DB.financial.savings={goal:0,saved:0};
  if(!DB.financial.desire)DB.financial.desire={item:'',cost:0,saved:0};
  if(!DB.financial.spending)DB.financial.spending={};
}
function isoMonth(dateStr){return dateStr.slice(0,7);}
const SPEND_CATS=['Food','Transport','Shopping','Health','Entertainment','Other'];
function getMonthSpend(cat){const m=isoMonth(today());const entries=(DB.financial.spending[cat]||[]).filter(e=>e.date.startsWith(m));return entries.reduce((s,e)=>s+(parseFloat(e.amt)||0),0);}
function getTotalMonthSpend(){return SPEND_CATS.reduce((s,c)=>s+getMonthSpend(c),0);}

function renderFinancial(){
  initFinancial();
  const f=DB.financial;
  const savingsPct=f.savings.goal>0?Math.min(100,Math.round((f.savings.saved/f.savings.goal)*100)):0;
  const desirePct=f.desire.cost>0?Math.min(100,Math.round((f.desire.saved/f.desire.cost)*100)):0;
  const totalSpend=getTotalMonthSpend();
  const spendCatHtml=SPEND_CATS.map(cat=>{const amt=getMonthSpend(cat);return`<div style="background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:14px"><div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px">${cat}</div><div style="font-size:24px;font-weight:800;color:var(--ink2);margin-bottom:10px">$${amt.toLocaleString()}</div><div style="display:flex;gap:6px"><input class="cat-add-inp" style="flex:1;font-size:13px" type="number" min="0" step="0.01" placeholder="+$" id="spend_${cat}"><button class="add-win-btn" style="padding:8px 14px;font-size:13px" onclick="addSpend('${cat}')">Add</button></div></div>`;}).join('');
  document.getElementById('viewBody').innerHTML=`
    <div class="post"><div class="post-header"><div class="post-avatar">🏦</div><div><div class="post-title">Savings goal</div><div class="post-sub">Track your savings progress</div></div></div><div class="post-body"><div class="savings-goal-card"><div class="savings-amounts" style="margin-bottom:6px"><span>Saved: <strong>$${(parseFloat(f.savings.saved)||0).toLocaleString()}</strong></span><span>Goal: <strong>$${(parseFloat(f.savings.goal)||0).toLocaleString()}</strong></span></div><div class="savings-progress-bar"><div class="savings-progress-fill" style="width:${savingsPct}%"></div></div><div style="text-align:right;font-size:12px;color:var(--purple);font-weight:700;margin-bottom:14px">${savingsPct}%</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px"><div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:4px">Set goal</div><input class="cat-add-inp" style="width:100%" type="number" min="0" placeholder="$5,000" id="savings_goal" value="${parseFloat(f.savings.goal)||''}"></div><div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:4px">Add amount</div><input class="cat-add-inp" style="width:100%" type="number" min="0" placeholder="$200" id="savings_add"></div></div><button class="primary-btn" onclick="updateSavings()">Update savings</button><div class="save-confirm" id="savingsConfirm" style="margin-top:8px">Saved ✦</div></div></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">✨</div><div><div class="post-title">Desire goal</div><div class="post-sub">Something beautiful you're working toward</div></div></div><div class="post-body"><div class="desire-card"><div class="desire-label">I am saving for…</div><input class="cat-add-inp" style="width:100%;margin-bottom:12px" placeholder="e.g. dream vacation, new car…" id="desire_item" value="${esc(f.desire.item||'')}"><div class="savings-amounts" style="margin-bottom:6px"><span>Saved: <strong>$${(parseFloat(f.desire.saved)||0).toLocaleString()}</strong></span><span>Cost: <strong>$${(parseFloat(f.desire.cost)||0).toLocaleString()}</strong></span></div><div class="savings-progress-bar"><div class="savings-progress-fill" style="width:${desirePct}%"></div></div><div style="text-align:right;font-size:12px;color:var(--purple);font-weight:700;margin-bottom:14px">${desirePct}%</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px"><div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:4px">Total cost</div><input class="cat-add-inp" style="width:100%" type="number" min="0" placeholder="$2,000" id="desire_cost" value="${parseFloat(f.desire.cost)||''}"></div><div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:4px">Add savings</div><input class="cat-add-inp" style="width:100%" type="number" min="0" placeholder="$50" id="desire_add"></div></div><button class="primary-btn" onclick="updateDesire()">Update desire goal</button><div class="save-confirm" id="desireConfirm" style="margin-top:8px">Saved ✦</div></div></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">💭</div><div><div class="post-title">Money mindset</div><div class="post-sub">Your relationship with money</div></div></div><div class="post-body"><div class="priority-block"><div class="block-prompt">Money flows to me because I…</div><textarea class="ta" id="money_mindset" rows="2" placeholder="add value, show up consistently, think abundantly…">${esc(f.mindset||'')}</textarea></div><div style="height:8px"></div><button class="primary-btn" style="font-size:13px;padding:11px" onclick="saveMoneyMindset()">Save</button><div class="save-confirm" id="mindsetConfirm" style="margin-top:6px">Saved ✦</div></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">💳</div><div><div class="post-title">Spending tracker</div><div class="post-sub">This month · tap Add to log an expense</div></div></div><div class="post-body"><div style="text-align:right;font-size:14px;font-weight:700;color:var(--purple);margin-bottom:12px">Monthly total: <span style="font-size:18px">$${totalSpend.toLocaleString()}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">${spendCatHtml}</div><button class="primary-btn" style="background:#737373;font-size:13px;padding:12px" onclick="resetMonthSpend()">Reset month</button></div></div>`;
}

function addSpend(cat){initFinancial();const inp=document.getElementById('spend_'+cat);const amt=parseFloat(inp.value)||0;if(amt<=0)return;if(!DB.financial.spending[cat])DB.financial.spending[cat]=[];DB.financial.spending[cat].push({date:today(),amt});inp.value='';saveDB('financial',DB.financial);renderFinancial();}
function resetMonthSpend(){openModal('<div class="modal-handle"></div><div class="modal-title">Reset this month\'s spending?</div><div style="font-size:14px;color:var(--ink2);margin-bottom:16px;line-height:1.5">This clears every spending entry for this month. Other months stay.</div><div class="modal-footer"><button class="modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-save" style="background:#ef4444" onclick="closeModal();doResetMonthSpend()">Reset</button></div>');}
function doResetMonthSpend(){initFinancial();const m=isoMonth(today());SPEND_CATS.forEach(cat=>{if(DB.financial.spending[cat])DB.financial.spending[cat]=DB.financial.spending[cat].filter(e=>!e.date.startsWith(m));});saveDB('financial',DB.financial);renderFinancial();}
function updateSavings(){initFinancial();const goal=parseFloat(document.getElementById('savings_goal').value)||DB.financial.savings.goal;const add=parseFloat(document.getElementById('savings_add').value)||0;DB.financial.savings.goal=goal;DB.financial.savings.saved=Math.max(0,(DB.financial.savings.saved||0)+add);saveDB('financial',DB.financial);const conf=document.getElementById('savingsConfirm');conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';renderFinancial();},1200);}
function updateDesire(){initFinancial();const item=(document.getElementById('desire_item').value||'').trim();const cost=parseFloat(document.getElementById('desire_cost').value)||DB.financial.desire.cost;const add=parseFloat(document.getElementById('desire_add').value)||0;DB.financial.desire={item,cost,saved:Math.max(0,(DB.financial.desire.saved||0)+add)};saveDB('financial',DB.financial);const conf=document.getElementById('desireConfirm');conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';renderFinancial();},1200);}
function saveMoneyMindset(){initFinancial();DB.financial.mindset=(document.getElementById('money_mindset').value||'').trim();saveDB('financial',DB.financial);const conf=document.getElementById('mindsetConfirm');conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';},1400);}

// ═══════════════ EMOTIONAL ═══════════════
let selectedMood=null;
let emotionalEnergy=null;
const MOODS=[{label:'Grateful',emoji:'🙏'},{label:'Excited',emoji:'🤩'},{label:'Calm',emoji:'😌'},{label:'Confident',emoji:'💪'},{label:'Anxious',emoji:'😰'},{label:'Tired',emoji:'😴'},{label:'Frustrated',emoji:'😤'},{label:'Sad',emoji:'😢'}];

function renderEmotional(){
  const todayEntry=(DB.emotional||[]).find(e=>e.date===today());
  if(todayEntry){selectedMood=todayEntry.mood?{label:todayEntry.mood,emoji:todayEntry.moodEmoji}:null;emotionalEnergy=todayEntry.energy||null;}
  else{selectedMood=DB.todayMood||null;emotionalEnergy=DB.todayEnergy||null;}
  const entries=DB.emotional||[];
  let html=`
    <div class="post"><div class="post-header"><div class="post-avatar">💜</div><div><div class="post-title">How are you feeling?</div><div class="post-sub">Check in with yourself</div></div></div><div class="post-body"><div class="mood-grid">${MOODS.map(m=>`<div class="mood-btn" id="mood_${m.label}" onclick="selectMood('${m.label}','${m.emoji}')"><div class="mood-emoji">${m.emoji}</div><div class="mood-label">${m.label}</div></div>`).join('')}</div></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">⚡</div><div><div class="post-title">Energy level</div><div class="post-sub">Rate your energy today (1–10)</div></div></div><div class="post-body"><div class="energy-dots" id="energyDots">${energyDotsHtml(null)}</div></div></div>
    <div class="post"><div class="post-header"><div class="post-avatar">✍️</div><div><div class="post-title">Check in</div><div class="post-sub">Process what's present for you today</div></div></div><div class="post-body">
      <div style="margin-bottom:10px"><div style="font-size:16px;font-weight:700;color:var(--ink2);margin-bottom:4px">What's bothering you?</div><div style="font-size:13px;color:var(--ink3);margin-bottom:8px">The problem or challenge on my mind…</div><textarea class="ta" id="em_problem" placeholder="Be honest — what's weighing on you?" rows="2"></textarea></div>
      <div style="margin-bottom:10px"><div style="font-size:16px;font-weight:700;color:var(--ink2);margin-bottom:4px">What's actually true?</div><div style="font-size:13px;color:var(--ink3);margin-bottom:8px">Separate the story from the facts…</div><textarea class="ta" id="em_lesson" placeholder="When I strip away the fear, what's really true here?" rows="2"></textarea></div>
      <div style="margin-bottom:10px;background:var(--purple-bg);border-radius:14px;padding:16px"><div style="font-size:16px;font-weight:700;color:var(--purple);margin-bottom:4px">How can I reframe it or take action?</div><div style="font-size:13px;color:var(--ink3);margin-bottom:8px">One thing I can think, say, or do differently…</div><textarea class="ta" id="em_excited" placeholder="I can choose to see this as… or I can take the step of…" rows="2"></textarea></div>
      <div style="margin-bottom:10px;background:#fff8e7;border-radius:14px;padding:16px;border-left:3px solid #f5a623"><div style="font-size:16px;font-weight:700;color:#c47d00;margin-bottom:4px">What am I excited about today?</div><div style="font-size:13px;color:var(--ink3);margin-bottom:8px">Something I'm looking forward to or energized by…</div><textarea class="ta" id="em_excitedabout" placeholder="I'm excited about…" rows="2"></textarea></div>
      <div style="margin-bottom:12px;background:#f0f7f0;border-radius:14px;padding:16px;border-left:3px solid #4caf50"><div style="font-size:16px;font-weight:700;color:#2e7d32;margin-bottom:4px">Tune in — what do you need today?</div><div style="font-size:13px;color:var(--ink3);margin-bottom:8px">My soul is asking for…</div><textarea class="ta" id="em_need" placeholder="Rest? Connection? Movement? Silence? Fun?" rows="2"></textarea></div>
      <button class="primary-btn" onclick="saveEmotional()">Save check-in</button>
      <div class="save-confirm" id="emConfirm" style="margin-top:8px">Saved ✦</div>
    </div></div>`;
  if(entries.length){
    html+=`<div class="past-label">Past check-ins</div>`;
    entries.slice(0,7).forEach(e=>{
      html+=`<div class="log-entry"><div class="log-date">${fmtShort(e.date)}${e.mood?' · '+e.moodEmoji+' '+e.mood:''} ${e.energy?' · ⚡'+e.energy+'/10':''}</div>${e.problem?`<div style="margin-bottom:6px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink4);margin-bottom:2px">Heavy</div><div class="log-text">${esc(e.problem)}</div></div>`:''} ${e.lesson?`<div style="margin-bottom:6px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink4);margin-bottom:2px">Lesson</div><div class="log-text">${esc(e.lesson)}</div></div>`:''} ${e.excited?`<div style="margin-bottom:6px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--purple);margin-bottom:2px">Reframe</div><div class="log-text">${esc(e.excited)}</div></div>`:''} ${e.need?`<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6b8f6b;margin-bottom:2px">I need</div><div class="log-text">${esc(e.need)}</div></div>`:''}<div class="log-foot"><button class="del-btn" onclick="deleteEmotional('${e.id}')">Delete</button></div></div>`;
    });
  }
  document.getElementById('viewBody').innerHTML=html;
  if(selectedMood) document.querySelectorAll('.mood-btn').forEach(b=>b.classList.toggle('mood-sel',b.id==='mood_'+selectedMood.label));
  if(emotionalEnergy){const el=document.getElementById('energyDots');if(el)el.innerHTML=energyDotsHtml(emotionalEnergy);}
}

function energyDotsHtml(selected){return Array.from({length:10},(_,i)=>i+1).map(n=>`<div class="e-dot${selected===n?' e-dot-sel':''}" onclick="setEmotionalEnergy(${n})">${n}</div>`).join('');}
function syncTodayEmotion(){const e=(DB.emotional||[]).find(x=>x.date===today());if(!e)return;if(selectedMood){e.mood=selectedMood.label;e.moodEmoji=selectedMood.emoji;}if(emotionalEnergy!=null)e.energy=emotionalEnergy;saveDB('emotional',DB.emotional);}
function setEmotionalEnergy(val){emotionalEnergy=val;saveDB('todayEnergy',val);syncTodayEmotion();const el=document.getElementById('energyDots');if(el)el.innerHTML=energyDotsHtml(val);}
function selectMood(label,emoji){selectedMood={label,emoji};saveDB('todayMood',selectedMood);syncTodayEmotion();document.querySelectorAll('.mood-btn').forEach(b=>b.classList.toggle('mood-sel',b.id==='mood_'+label));}
function saveEmotional(){const problem=(document.getElementById('em_problem').value||'').trim();const lesson=(document.getElementById('em_lesson').value||'').trim();const excited=(document.getElementById('em_excited').value||'').trim();const excitedAbout=(document.getElementById('em_excitedabout').value||'').trim();const need=(document.getElementById('em_need').value||'').trim();if(!problem&&!lesson&&!excited&&!excitedAbout&&!need&&!selectedMood&&!emotionalEnergy)return;if(!DB.emotional)DB.emotional=[];DB.emotional.unshift({id:Date.now().toString(),date:today(),mood:selectedMood?selectedMood.label:'',moodEmoji:selectedMood?selectedMood.emoji:'',energy:emotionalEnergy||'',problem,lesson,excited,excitedAbout,need});saveDB('emotional',DB.emotional);const conf=document.getElementById('emConfirm');conf.style.opacity='1';setTimeout(()=>{conf.style.opacity='0';renderEmotional();},1400);}
